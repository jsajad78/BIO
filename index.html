<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سجاد جعفری | در حال احداث</title>
    
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'system-ui', 'sans-serif'],
                        en: ['system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617; /* zinc-950 */
            color: #f8fafc;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
        }

        /* Hammer Animation */
        @keyframes hammer-swing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg) scale(1.05); }
            75% { transform: rotate(-15deg) scale(1.05); }
        }
        .animate-hammer {
            animation: hammer-swing 2.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Canvas Background -->
    <canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-80"></canvas>

    <!-- Language Switcher -->
    <div class="fixed top-6 right-6 z-50 flex bg-slate-900/80 backdrop-blur-xl border border-slate-700 rounded-full p-1 shadow-lg" dir="ltr">
        <button onclick="setLang('fa')" id="btn-fa" class="px-4 py-1.5 rounded-full text-sm font-bold transition-colors bg-sky-500 text-white">FA</button>
        <button onclick="setLang('en')" id="btn-en" class="px-4 py-1.5 rounded-full text-sm font-bold transition-colors text-slate-400 hover:text-white">EN</button>
    </div>

    <!-- Main Content -->
    <div id="main-container" class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6 transition-all duration-500">
        <div class="bg-slate-900/60 backdrop-blur-2xl border border-white/10 rounded-[2.5rem] p-10 md:p-16 text-center max-w-2xl w-full shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden group">
            
            <!-- Top Glow Effect -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-1/2 bg-sky-500/10 blur-[100px] pointer-events-none transition-all duration-1000 group-hover:bg-fuchsia-500/10"></div>
            
            <div class="relative z-10 flex flex-col items-center">
                <!-- Icon -->
                <div class="animate-hammer mb-8 p-6 bg-sky-500/10 rounded-3xl border border-sky-500/30 text-sky-400 shadow-[0_0_30px_rgba(14,165,233,0.3)] inline-flex items-center justify-center">
                    <i class="fas fa-hammer text-4xl md:text-5xl"></i>
                </div>

                <!-- Text Content -->
                <h1 id="title" class="text-4xl md:text-5xl lg:text-6xl font-black mb-6 tracking-tight bg-gradient-to-br from-white via-sky-100 to-slate-400 bg-clip-text text-transparent">
                    سایت در حال احداث است
                </h1>
                
                <p id="desc" class="text-slate-400 text-lg md:text-xl mb-12 leading-relaxed max-w-lg mx-auto">
                    ما در حال طراحی و توسعه یک پلتفرم قدرتمند هستیم. به زودی با امکانات بی‌نظیر بازمی‌گردیم.
                </p>

                <!-- Loader -->
                <div class="w-full flex items-center justify-center gap-4">
                    <i class="fas fa-circle-notch fa-spin text-fuchsia-400 text-2xl"></i>
                    <span id="loading-text" class="text-sm font-medium tracking-widest text-fuchsia-400 uppercase">
                        در حال آماده‌سازی...
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Logic Scripts -->
    <script>
        // Language Data
        const translations = {
            fa: {
                title: 'سایت در حال احداث است',
                desc: 'ما در حال طراحی و توسعه یک پلتفرم قدرتمند هستیم. به زودی با امکانات بی‌نظیر بازمی‌گردیم.',
                loading: 'در حال آماده‌سازی...',
                dir: 'rtl',
                font: 'font-sans'
            },
            en: {
                title: 'Website Under Construction',
                desc: 'We are designing and developing a powerful platform. We will be back soon with incredible features.',
                loading: 'PREPARING...',
                dir: 'ltr',
                font: 'font-en'
            }
        };

        // Language Switcher Logic
        function setLang(lang) {
            const data = translations[lang];
            
            // Update texts
            document.getElementById('title').innerText = data.title;
            document.getElementById('desc').innerText = data.desc;
            document.getElementById('loading-text').innerText = data.loading;
            
            // Update direction and font
            const main = document.getElementById('main-container');
            main.setAttribute('dir', data.dir);
            document.body.className = `antialiased ${data.font}`;

            // Update Buttons
            const btnFa = document.getElementById('btn-fa');
            const btnEn = document.getElementById('btn-en');

            if(lang === 'fa') {
                btnFa.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-colors bg-sky-500 text-white";
                btnEn.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-colors text-slate-400 hover:text-white";
            } else {
                btnEn.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-colors bg-sky-500 text-white";
                btnFa.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-colors text-slate-400 hover:text-white";
            }
        }

        // Canvas Particles Animation (Cyan & Magenta theme)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            pts = [];
            // Create particles
            for(let i = 0; i < 50; i++) {
                pts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    color: Math.random() > 0.5 ? '#0ea5e9' : '#d946ef' // Sky or Fuchsia
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            pts.forEach((p, index) => {
                // Move
                p.x += p.vx;
                p.y += p.vy;
                
                // Bounce
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                // Draw Particle
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();

                // Draw Connections
                for(let j = index + 1; j < pts.length; j++) {
                    let p2 = pts[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = p.color === '#0ea5e9' 
                            ? `rgba(14, 165, 233, ${1 - dist/150})` 
                            : `rgba(217, 70, 239, ${1 - dist/150})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        draw();
    </script>
</body>
</html>
